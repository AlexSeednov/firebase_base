# Last full audit of the SDK and dependencies: 05.07.2026
name: firebase_base
description: "Unified base Firebase integration for Flutter applications"
version: 0.2.8
homepage: https://github.com/AlexSeednov/firebase_base
# Not publishable: pub.dev rejects git dependencies, and application_base is
# one.
publish_to: 'none'

environment:
  # Minimum Flutter SDK. The packages it pins:
  # https://github.com/flutter/flutter/blob/3.44.4/packages/flutter/pubspec.yaml
  # Release notes: https://github.com/flutter/flutter/blob/stable/CHANGELOG.md
  flutter: '>=3.44.4'

  # Minimum Dart SDK. The one each Flutter release ships:
  # https://docs.flutter.dev/release/archive
  # Release notes: https://dart.googlesource.com/sdk/+/stable/CHANGELOG.md
  sdk: '>=3.12.2'

dependencies:
  # All platform supported
  #
  # A range rather than a caret: the package uses nothing newer than 0.3.0, so
  # both minor lines in use across the applications resolve, and neither has
  # to move for this package.
  application_base:
    git:
      url: https://github.com/AlexSeednov/application_base
      tag_pattern: v{{version}}
    version: '>=0.3.0 <0.5.0'

  # Not supported: Linux | MacOS | Web | Windows
  #
  # Local notifications: the foreground pushes on Android
  awesome_notifications: ^0.12.1 # This version is managed by core plugin
  awesome_notifications_core: ^0.10.1

  # Not supported: Linux
  firebase_core: ^4.11.0

  # Not supported: Linux | Web | Windows
  firebase_crashlytics: ^5.2.4

  # Not supported: Linux | Windows
  firebase_messaging: ^16.4.1

  # Base SDK
  flutter:
    sdk: flutter

  # All platform supported
  injectable: ^3.0.0

  # All platform supported
  intl: ^0.20.3

  # All platform supported
  json_annotation: ^4.12.0

  # All platform supported
  meta: ^1.16.0

  # All platform supported
  rxdart: ^0.28.0

dev_dependencies:
  build_runner: ^2.15.0

  #
  flutter_test:
    sdk: flutter

  # dart run build_runner build
  injectable_generator: ^3.1.0

  # dart run build_runner build
  json_serializable: ^6.14.0

flutter:
