# Last full SDK + dependency audit - 05.07.2026
name: firebase_base
description: "Unified base Firebase integration for Flutter applications"
version: 0.2.6
homepage: https://github.com/AlexSeednov/firebase_base
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
# Publishable packages can't have 'git' dependencies and because of this
# package depends on non-published application_base it can not be published
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  # Flutter SDK supported versions
  # Pinned packages
  # https://github.com/flutter/flutter/blob/3.44.4/packages/flutter/pubspec.yaml
  # https://github.com/flutter/flutter/blob/stable/CHANGELOG.md
  flutter: '>=3.44.4'

  # Dart SDK supported versions
  # https://docs.flutter.dev/release/archive
  # https://dart.googlesource.com/sdk/+/stable/CHANGELOG.md
  sdk: '>=3.12.2'

dependencies:
  # All platform supported
  application_base:
    git:
      url: https://github.com/AlexSeednov/application_base
      tag_pattern: v{{version}}
    version: ^0.3.0

  # Not supported: Linux | MacOS | Web | Windows
  #
  # Awesome plugins for local notifications
  awesome_notifications: ^0.12.1 # This version is managed by core plugin
  awesome_notifications_core: ^0.10.1

  # Not supported: Linux
  firebase_core: ^4.11.0

  # Not supported: Linux | Web | Windows
  firebase_crashlytics: ^5.2.4

  # Not supported: Linux | Windows
  firebase_messaging: ^16.4.1

  # Base SDK
  flutter:
    sdk: flutter

  # All platform supported
  injectable: ^3.0.0

  # All platform supported
  intl: ^0.20.3

  # All platform supported
  json_annotation: ^4.12.0

  # All platform supported
  meta: ^1.16.0

  # All platform supported
  rxdart: ^0.28.0

#
dev_dependencies:
  build_runner: ^2.15.0

  #
  flutter_test:
    sdk: flutter

  # dart run build_runner build
  injectable_generator: ^3.1.0

  # dart run build_runner build
  json_serializable: ^6.14.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
